# --- HTTP: billpay-online takes 8080 and billpay-offline 8081, so billpay-ui's backend sits on 8090 ---
quarkus.http.port=8090
quarkus.http.test-port=0

# --- Datasource: embedded H2, file-backed (survives restarts) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/billpay;AUTO_SERVER=TRUE
quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:billpay-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# --- CORS for the Vite dev server (it proxies /api, so this is only for direct calls) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,X-Billpay-Role

# --- Each environment's Market Onboarding API: its billpay-offline ---
# An environment with no URL is simulated (a marked placeholder). Locally e1 is billpay-core's billpay-offline;
# e2 and e3 are simulated, since one local billpay-offline can't stand for three environments.
# Override per run, e.g. BILLPAY_ENVIRONMENTS_E1_URL=http://other-host:8081, or BILLPAY_ENVIRONMENTS_E1_URL= to simulate e1.
billpay.environments.e1.url=http://localhost:8081
billpay.environments.e2.url=
billpay.environments.e3.url=

# --- The deployment tracker: how often in-flight releases are read ---
billpay.tracker.every=1s

# --- Demo markets for an empty database ---
billpay.seed=true

# --- Tests: no seed, and a fast simulated pace (the scheduler's floor is one second) ---
%test.billpay.seed=false
%test.billpay.simulated.beat=50ms
